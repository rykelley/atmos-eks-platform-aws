################################################################################
# eks/external-secrets-operator — Syncs AWS Secrets Manager into Kubernetes
# Secrets, so DB credentials never live in YAML in git.
#
# Replaces the article's hand-encoded base64 `db-secrets` Secret.
################################################################################
components:
  terraform:
    eks/external-secrets-operator:
      metadata:
        component: eks/external-secrets-operator
        type: abstract
      vars:
        enabled: true
        name: "external-secrets"
        kubernetes_namespace: "external-secrets"
        create_namespace: true
        chart: "external-secrets"
        chart_repository: "https://charts.external-secrets.io"
        chart_version: "0.10.4"
        timeout: 300
        wait: true
        atomic: true
        cleanup_on_fail: true

        chart_values:
          installCRDs: true
          replicaCount: 1
          webhook:
            replicaCount: 1
          certController:
            replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
