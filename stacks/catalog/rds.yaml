################################################################################
# rds — Postgres for the 3-tier app, in private subnets, locked to the
#       cluster security group.
################################################################################
components:
  terraform:
    rds:
      metadata:
        component: rds
        type: abstract
      vars:
        enabled: true
        name: "appdb"
        engine: "postgres"
        engine_version: "15.7"
        instance_class: "db.t3.small"
        allocated_storage: 20
        storage_type: "gp3"
        storage_encrypted: true
        publicly_accessible: false
        multi_az: false
        deletion_protection: false
        skip_final_snapshot: true
        backup_retention_period: 7
        backup_window: "07:00-09:00"
        maintenance_window: "Mon:00:00-Mon:03:00"

        database_name: "appdb"
        database_user: "appadmin"
        # Password is generated by the component, written to AWS Secrets Manager,
        # and consumed by external-secrets-operator inside the cluster.
        database_password: ""

        database_port: 5432
        db_parameter_group: "postgres15"
        performance_insights_enabled: true
        monitoring_interval: 60

        # Allow ingress from the EKS node security group via remote state.
        allowed_security_groups: []
        allowed_cidr_blocks: []

        apply_immediately: true
        snapshot_identifier: ""
