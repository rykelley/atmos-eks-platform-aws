################################################################################
# three-tier-app — The application stack from the AWS Tip article, IaC'd.
#
# Deploys the React frontend + Flask backend Helm release, the database
# migration Job, the ExternalSecret pulling RDS creds out of Secrets Manager,
# and the Ingress wired to the ALB Controller + cert-manager + external-dns.
################################################################################
components:
  terraform:
    three-tier-app:
      metadata:
        component: three-tier-app
        type: abstract
      vars:
        enabled: true
        kubernetes_namespace: "3-tier-app-eks"
        create_namespace: true

        # App images — bump tags here to roll the app forward.
        backend_image: "livingdevopswithakhilesh/devopsdozo"
        backend_tag: "backend-latest"
        frontend_image: "livingdevopswithakhilesh/devopsdozo"
        frontend_tag: "frontend-latest"

        backend_replicas: 2
        frontend_replicas: 2

        # Hostname is composed in stage mixin: <subdomain>.<delegated zone>
        hostname_template: "app.{{ .stage }}.thepolarbearclub3d.com"

        # cert-manager wiring — set to letsencrypt-staging while iterating.
        cluster_issuer: "letsencrypt-prod"

        # Ingress class registered by AWS LBC
        ingress_class_name: "alb"

        ingress_annotations:
          alb.ingress.kubernetes.io/scheme: "internet-facing"
          alb.ingress.kubernetes.io/target-type: "ip"
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
          alb.ingress.kubernetes.io/healthcheck-path: "/"
          alb.ingress.kubernetes.io/healthcheck-protocol: "HTTP"
          alb.ingress.kubernetes.io/backend-protocol: "HTTP"
          # external-dns will create the Route53 alias from this annotation.
          external-dns.alpha.kubernetes.io/hostname: "app.{{ .stage }}.thepolarbearclub3d.com"

        # Database wiring — RDS endpoint is read from rds component's remote state.
        # The Postgres DSN is assembled in the component itself.
        run_db_migration_job: true
