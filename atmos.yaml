# Atmos CLI configuration
# https://atmos.tools/cli/configuration

base_path: "."

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: true
  helmfile:
    base_path: "components/helmfile"
    use_eks: true
    kubeconfig_path: "/dev/shm"
    helm_aws_profile_pattern: "{namespace}-{tenant}-gbl-{stage}-helm"
    cluster_name_pattern: "{namespace}-{tenant}-{environment}-{stage}-eks-cluster"

stacks:
  base_path: "stacks"
  # Discover top-level stacks (one per account/region) using this pattern
  included_paths:
    - "orgs/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  # Stack name template: <namespace>-<tenant>-<environment>-<stage>
  # e.g. plat-platform-usw2-dev
  name_pattern: "{namespace}-{tenant}-{environment}-{stage}"

workflows:
  base_path: "stacks/workflows"

logs:
  file: "/dev/stdout"
  level: Info

# Schema for stack validation
schemas:
  jsonschema:
    base_path: "stacks/schemas/jsonschema"
  opa:
    base_path: "stacks/schemas/opa"

# Validation
templates:
  settings:
    enabled: true
    sprig:
      enabled: true
    gomplate:
      enabled: true
      timeout: 5

# Vendor configuration (vendor.yaml)
vendor:
  base_path: "./vendor.yaml"

# Integrations
integrations:
  github:
    gitops:
      terraform-version: "1.9.5"
      infracost-enabled: false
      artifact-storage:
        region: "us-west-2"
        bucket: "plat-core-usw2-gha-gitops"
        table: "plat-core-usw2-gha-gitops"
        role: "arn:aws:iam::000000000000:role/plat-core-gbl-identity-gitops"
      role:
        plan: "arn:aws:iam::000000000000:role/plat-core-gbl-identity-gitops-plan"
        apply: "arn:aws:iam::000000000000:role/plat-core-gbl-identity-gitops-apply"
      matrix:
        sort-by: .stack_slug
        group-by: .stack_slug | split("-") | [.[0], .[2]] | join("-")

# Custom commands
commands:
  - name: tf
    description: "Shortcut for `atmos terraform`"
    commands:
      - name: plan-all
        description: "Plan all components in a stack"
        arguments:
          - name: stack
            description: Stack name
        steps:
          - atmos terraform plan vpc -s {{ .Arguments.stack }}
          - atmos terraform plan eks/cluster -s {{ .Arguments.stack }}
